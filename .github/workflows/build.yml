name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build debug APK
        run: |
          set +e
          gradle assembleDebug --no-daemon --console=plain > build.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            {
              echo "BUILD FAILED. Key lines:"
              grep -E "^e: |error:|What went wrong|Could not|Execution failed|Manifest merger|minSdk|^> " build.log | head -60
              echo "--- tail ---"
              tail -30 build.log
            } > summary.txt
            body=$(head -c 14000 summary.txt | sed 's/%/%25/g; s/\r//g' | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=Gradle::${body}"
          fi
          exit $code

      - uses: actions/upload-artifact@v4
        with:
          name: Vornex-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK as a release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Vornex build ${{ github.run_number }}
          files: app/build/outputs/apk/debug/app-debug.apk
