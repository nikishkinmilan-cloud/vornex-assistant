name: Build data

# Собирает базы знаний и нейросеть и выкладывает их в Releases (тег "data").
# Запуск: вкладка Actions -> Build data -> Run workflow.

on:
  workflow_dispatch:
    inputs:
      zim_kind:
        description: "Какой ZIM Википедии брать: mini (лёгкий) или nopic (большой, долго)"
        default: mini
      limit:
        description: "Сколько статей взять (0 = все). Для быстрой сборки: 500000"
        default: "0"

permissions:
  contents: write

jobs:
  data:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL || true
          df -h /

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install libzim beautifulsoup4 lxml huggingface_hub

      - name: Find and download Russian Wikipedia ZIM
        run: |
          set -e
          kind="${{ inputs.zim_kind }}"
          [ -n "$kind" ] || kind=mini
          curl -fsSL https://download.kiwix.org/zim/wikipedia/ -o index.html
          name=$(grep -oE "wikipedia_ru_all_${kind}_[0-9]{4}-[0-9]{2}\.zim" index.html | sort -u | tail -1 || true)
          if [ -z "$name" ]; then
            echo "::error::На download.kiwix.org нет файла wikipedia_ru_all_${kind}. Есть такие: $(grep -oE 'wikipedia_ru_[a-z_]+_[0-9]{4}-[0-9]{2}\.zim' index.html | sort -u | tr '\n' ' ')"
            exit 1
          fi
          echo "Беру $name"
          curl -fL --retry 5 --retry-delay 10 -o wiki.zim "https://download.kiwix.org/zim/wikipedia/$name"
          ls -la wiki.zim
          echo "::notice::ZIM: $name ($(du -h wiki.zim | cut -f1))"

      - name: Build wiki.db
        run: |
          lim="${{ inputs.limit }}"
          if [ -n "$lim" ] && [ "$lim" != "0" ]; then python tools/build_wiki_db.py wiki.zim wiki.db --limit "$lim"; else python tools/build_wiki_db.py wiki.zim wiki.db; fi

      - name: Build places.db
        run: python tools/build_places_db.py places.db

      - name: Download on-device model
        run: |
          python - <<'EOF'
          import shutil, sys
          from huggingface_hub import HfApi, hf_hub_download

          api = HfApi()
          candidates = [
              "litert-community/Qwen2.5-1.5B-Instruct",
              "litert-community/Qwen3-1.7B",
              "litert-community/Qwen3-0.6B",
          ]
          for repo in candidates:
              try:
                  info = api.model_info(repo, files_metadata=True)
                  files = [(s.size or 0, s.rfilename) for s in info.siblings if s.rfilename.endswith(".litertlm")]
                  print(repo, files, flush=True)
                  if not files:
                      continue
                  files.sort()
                  size, name = files[0]          # самый маленький вариант
                  path = hf_hub_download(repo, name)
                  shutil.copy(path, "model.litertlm")
                  print(f"::notice::Модель: {repo} / {name} ({size / 1e9:.2f} ГБ)")
                  sys.exit(0)
              except Exception as e:
                  print(f"{repo}: {e}", flush=True)
          print("::error::Не нашёл .litertlm модель ни в одном из репозиториев")
          sys.exit(1)
          EOF
          ls -la model.litertlm

      - name: Publish data release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la wiki.db places.db model.litertlm
          echo "::notice::Размеры: wiki.db $(du -h wiki.db | cut -f1), places.db $(du -h places.db | cut -f1), model $(du -h model.litertlm | cut -f1)"
          gh release delete data --yes --cleanup-tag 2>/dev/null || true
          gh release create data --title "Vornex data" \
            --notes "wiki.db (Википедия), places.db (места), model.litertlm (нейросеть). Скачать на телефон и выбрать в приложении кнопками 4, 5, 6." \
            wiki.db places.db model.litertlm
